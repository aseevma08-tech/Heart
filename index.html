<style>
/* Layout: one night screen. A heart of compliments blooms from its centre and beats; a tap on it starts the song and quickens the pulse. */
:root{
  --bg:#0c0709;
  --halo:rgba(255,60,92,.16);
  --ink:#f6e8e6;
  --muted:#a68c91;
  --rose:#ff4f64;
  --rose-2:#ff7b8a;
  --rose-3:#ffb3bb;
  --hot:#ffe3e5;
  --glow:rgba(255,52,86,.5);
  --f-word:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-script:"Marck Script","Segoe Script","Brush Script MT",cursive;
  --reveal:4s;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{background:var(--bg)}
html,body{height:100%}
body{margin:0;padding-inline:16px;box-sizing:border-box;background:radial-gradient(70% 48% at 50% 40%,var(--halo),transparent 72%),var(--bg);color:var(--ink);overflow-x:hidden;-webkit-text-size-adjust:100%}
.page{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,3.2vh,30px);padding-block:20px}
.stage{display:block;flex:none;width:min(100%,560px);width:min(100%,560px,max(260px,calc((100svh - 220px) * 1.0169)));margin:0;padding:0;border:0;border-radius:24px;background:none;color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stage:focus-visible{outline:2px solid var(--rose-3);outline-offset:6px}
.heart{display:block;width:100%;height:auto;overflow:visible;font:800 13.09px/1 var(--f-word);text-rendering:geometricPrecision;transform-origin:50% 46%;filter:drop-shadow(0 0 5px var(--glow));transition:filter .6s;animation:beat 2.8s ease-in-out calc(var(--reveal) + .9s) infinite}
.stage.touched .heart{animation-delay:0s}
.stage.playing .heart{filter:drop-shadow(0 0 10px var(--glow));animation:beat2 .9s ease-in-out infinite}
.w{fill:var(--rose);animation:appear .8s ease-out var(--d,0s) backwards}
.t2{fill:var(--rose-2)}
.t3{fill:var(--rose-3)}
.hot{fill:var(--hot)}
.tw{animation:appear .8s ease-out var(--d,0s) backwards,twinkle 3.6s ease-in-out var(--t,0s) infinite}
.note{margin:0;text-align:center;text-wrap:balance;font:400 clamp(2rem,8.6vw,3.4rem)/1.12 var(--f-script);color:var(--ink);animation:rise 1s ease-out calc(var(--reveal) + .1s) backwards}
.hint{margin:0;font:700 .7rem/1 var(--f-word);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);animation:rise 1s ease-out calc(var(--reveal) + 1.3s) backwards}
@keyframes appear{from{opacity:0;transform:translateY(5px)}}
@keyframes twinkle{50%{fill:var(--hot)}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.028)}24%{transform:scale(1)}36%{transform:scale(1.02)}52%{transform:scale(1)}}
@keyframes beat2{0%,100%{transform:scale(1)}14%{transform:scale(1.05)}28%{transform:scale(1)}42%{transform:scale(1.035)}60%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(.5em)}}
@media (prefers-reduced-motion:reduce){.w,.tw,.heart,.stage.playing .heart,.note,.hint{animation:none!important}}
</style>
</head>

<!-- Положи свою песню рядом с этим файлом и назови её song.mp3 -->
<audio id="song" src="song.mp3" preload="auto" loop></audio>

<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage');
  var hint = document.getElementById('hint');
  var song = document.getElementById('song');
  if (!stage || !hint || !song) return;
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  hint.hidden = false;

  function show(playing) {
    stage.classList.toggle('playing', playing);
    stage.setAttribute('aria-label', playing ? 'Остановить музыку' : 'Включить музыку');
    hint.textContent = playing ? 'музыка играет' : 'нажми на сердце';
  }
  song.addEventListener('play', function () { show(true); });
  song.addEventListener('pause', function () { show(false); });

  stage.addEventListener('click', function () {
    stage.classList.add('touched');
    if (!reduce && stage.animate) {
      try {
        stage.animate(
          [{ transform: 'scale(1)' }, { transform: 'scale(1.05)', offset: 0.35 }, { transform: 'scale(1)' }],
          { duration: 420, easing: 'ease-out' }
        );
      } catch (e) { /* the pop is a nicety */ }
    }
    if (song.paused) {
      var p = song.play();
      if (p && p.catch) {
        p.catch(function () { song.pause(); hint.hidden = true; });
      }
    } else {
      song.pause();
    }
  });
})();
</script>
